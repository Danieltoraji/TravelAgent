name: Deploy Django to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ensure remote directory
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "mkdir -p ~/travelagent"

      - name: Sync code to server
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          rsync -avz --delete \
            -e "sshpass -e ssh -o StrictHostKeyChecking=no" \
            --exclude '.git' \
            --exclude 'logs' \
            --exclude 'output' \
            --exclude '.env' \
            --exclude 'django_server/db.sqlite3' \
            --exclude 'config/local_settings.py' \
            ./ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/travelagent/"

      - name: Deploy with Docker Compose
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "cd ~/travelagent && docker compose up -d --build"
