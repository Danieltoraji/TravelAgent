name: Deploy Django to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -f django_server/Dockerfile -t travelagent-django:latest .

      - name: Save Docker image
        run: |
          docker save travelagent-django:latest | gzip > travelagent-django.tar.gz

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ensure remote directory
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 -o ServerAliveCountMax=5 \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "mkdir -p /opt/travelagent"

      - name: Sync code and image to server
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          rsync -avz --delete \
            -e "sshpass -e ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=5" \
            --exclude '.git' \
            --exclude 'logs' \
            --exclude 'output' \
            --exclude '.env' \
            --exclude 'config/local_settings.py' \
            ./ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/travelagent/"

      - name: Write .env on server (from GitHub Secrets)
        # 合码 0823：VPS 的 .env 由 Actions 从 GitHub Secrets 全量生成，
        # 之后无需手动 SSH 配置 key。Secrets 配置见仓库 Settings→Secrets and variables→Actions：
        #   必填：DEEPSEEK_API_KEY
        #   可选：DEMO_MODE / LLM_PROVIDER / DEEPSEEK_MODEL / QWEATHER_API_KEY /
        #         QWEATHER_API_HOST / AMAP_API_KEY / ROLLINGGO_API_KEY / USE_LIVE_DATA
        #         JUHE_FLIGHT_KEY / AVIATIONSTACK_KEY / DEBUG_INJECT_TOKEN
        #         （缺省值见 ENV_CONTENT）
        # 注意：本步会覆盖服务器上的旧 .env（维护时以 Secrets 为准）。
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          ENV_CONTENT: |
            # TravelAgent 环境变量 —— 由 GitHub Actions 自动生成（deploy.yml），勿手动编辑
            DEMO_MODE=${{ secrets.DEMO_MODE || 'true' }}
            # A 侧真实数据开关：默认跟随 DEMO_MODE（DEMO_MODE=false 即开启真源）；
            # 也可用 Secret USE_LIVE_DATA 显式覆盖（如只想让工具真、矩阵仍用假图）。
            USE_LIVE_DATA=${{ secrets.USE_LIVE_DATA || ((secrets.DEMO_MODE == 'false') && 'true' || 'false') }}
            LLM_PROVIDER=${{ secrets.LLM_PROVIDER || 'deepseek' }}
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
            DEEPSEEK_BASE_URL=${{ secrets.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
            DEEPSEEK_MODEL=${{ secrets.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
            # 演示注入端点鉴权（公网必须设置；请求需带 X-Debug-Token 头）
            DEBUG_INJECT_TOKEN=${{ secrets.DEBUG_INJECT_TOKEN }}
            QWEATHER_API_KEY=${{ secrets.QWEATHER_API_KEY }}
            QWEATHER_API_HOST=${{ secrets.QWEATHER_API_HOST }}
            AMAP_API_KEY=${{ secrets.AMAP_API_KEY }}
            # RollingGo 酒店 MCP（hotel_tool live 模式；8.30 酒店真源）
            ROLLINGGO_MCP_URL=${{ secrets.ROLLINGGO_MCP_URL || 'https://mcp.rollinggo.cn/mcp' }}
            ROLLINGGO_API_KEY=${{ secrets.ROLLINGGO_API_KEY }}
            # E5：预约/动作持久化（生产开启；本地/测试默认关）
            BOOKING_PERSIST_PATH=${{ secrets.BOOKING_PERSIST_PATH || 'logs/actions.json' }}
            # 航班真源（8.29 接入；juhe 1962 主源 550 次/月，aviationstack 备选）
            JUHE_FLIGHT_KEY=${{ secrets.JUHE_FLIGHT_KEY }}
            AVIATIONSTACK_KEY=${{ secrets.AVIATIONSTACK_KEY }}
        run: |
          printf '%s\n' "$ENV_CONTENT" | sshpass -e ssh -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 -o ServerAliveCountMax=5 \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "mkdir -p /opt/travelagent && cat > /opt/travelagent/.env && chmod 600 /opt/travelagent/.env"
          echo "---- 已生成 /opt/travelagent/.env（值掩码显示）----"
          sshpass -e ssh -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 -o ServerAliveCountMax=5 \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "sed -E 's/^(.*=).*/\1<redacted>/' /opt/travelagent/.env"

      - name: Load image and deploy
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 -o ServerAliveCountMax=5 \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "cd /opt/travelagent && docker load < travelagent-django.tar.gz && if [ -f .env ]; then set -a; . ./.env; set +a; fi && docker compose up -d --no-build"

      - name: Health check (server localhost, no public port needed)
        # 合码 0823：部署后在服务器本机 curl 健康端点（只依赖 SSH 通道），
        # 服务是否活着直接体现在 Actions 日志，无需外部连 VPS。
        # 失败时自动抓取容器状态 / gunicorn 日志 / 端口监听，把原因带进日志。
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          SSH() {
            sshpass -e ssh -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=60 -o ServerAliveCountMax=5 \
              "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "$@"
          }
          ok=0
          for i in $(seq 1 30); do
            # 注意：① Django APPEND_SLASH 会把无尾斜杠的 /api/health 301 到 /api/health/，
            #    必须访问带斜杠的 URL（curl -L 双保险跟随重定向）；
            # ② JsonResponse 输出格式为 {"status": "ok", ...}（冒号后有空格），
            #    grep 模式用 '"status": *"ok"' 容忍 0 或多个空格。
            if SSH "curl -sfL --max-time 5 http://127.0.0.1:8000/api/health/" 2>/dev/null | grep -q '"status": *"ok"'; then
              echo "health OK after $((i * 10))s"
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" = "1" ]; then
            exit 0
          fi
          echo "== health check FAILED — collecting diagnostics =="
          SSH "echo '--- docker ps (travelagent) ---'; docker ps -a | grep -i travelagent || echo '(no travelagent container)'; echo '--- docker logs travelagent-django (tail 80) ---'; docker logs --tail 80 travelagent-django 2>&1 || echo '(no logs)'; echo '--- curl verbose ---'; curl -v --max-time 5 http://127.0.0.1:8000/api/health/ 2>&1 || true; echo '--- port 8000 ---'; (ss -ltn 2>/dev/null || netstat -ltn 2>/dev/null) | grep ':8000' || echo '(nothing listening on 8000)'"
          exit 1

      - name: Server business smoke (acceptance #1 #3 #4 + LLM decision #2)
        # 合码 0823：部署完成后在容器内执行验收冒烟（django_server/smoke/smoke_acceptance.py）：
        #   清单 1 规划 / 清单 3 酒店满房闭环 / 清单 4 导出 走 HTTP；
        #   清单 2 SCENIC→LLM 决策 在本进程驱动真实运行时（需 DEEPSEEK_API_KEY，缺失则跳过）。
        # 输出即服务器侧验收报告，Actions 绿勾即验收通过。
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 -o ServerAliveCountMax=5 \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "cd /opt/travelagent && docker compose exec -T web python smoke/smoke_acceptance.py"
