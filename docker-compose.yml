services:
  web:
    image: travelagent-django:latest
    build:
      context: .
      dockerfile: django_server/Dockerfile
    container_name: travelagent-django
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 多用户改造（2026-09）：sqlite 落在 named volume，容器重建数据不丢
      TRAVELAGENT_DB_PATH: /app/django_server/data/db.sqlite3
    volumes:
      - travelagent-data:/app/django_server/data
    # stdout 通道轮转兜底（server_log 2026-09-15）：应用级轮转文件在
    # data/logs/（named volume），这里防 docker json-file 无上限膨胀
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  travelagent-data:
